[project]
name = "comfyui-recavsr"
description = "ReCaVSR one-step streaming video super-resolution natively in ComfyUI: 4x on Wan2.2, block by block with its FlashDecoder. bf16 and int8 ConvRot, measured on an RTX 3090 and 4090, runs from 8 GB."
version = "2.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent", "Environment :: GPU :: NVIDIA CUDA"]
dependencies = []

[project.urls]
Repository = "https://github.com/PedroMarinhoDev/ComfyUI-ReCaVSR"
Documentation = "https://github.com/PedroMarinhoDev/ComfyUI-ReCaVSR#readme"
"Bug Tracker" = "https://github.com/PedroMarinhoDev/ComfyUI-ReCaVSR/issues"
"Model files" = "https://huggingface.co/PedroMarinhoDev/ReCaVSR-ComfyUI"

[tool.comfy]
PublisherId = "pedromarinhodev"
DisplayName = "ReCaVSR video super-resolution"
Icon = "https://raw.githubusercontent.com/PedroMarinhoDev/ComfyUI-ReCaVSR/main/assets/registry-icon.png"
Banner = "https://raw.githubusercontent.com/PedroMarinhoDev/ComfyUI-ReCaVSR/main/assets/registry-banner.png"
requires-comfyui = ">=0.44.0"
